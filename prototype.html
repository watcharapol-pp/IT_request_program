<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>IT Request Portal Prototype</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined|Material+Icons+Round|Material+Icons" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#38e07b", // Using provided theme instruction: #38e07b
                        "primary-hover": "#31c46b",
                        secondary: "#64748B", 
                        success: "#10B981", 
                        danger: "#EF4444", 
                        warning: "#F59E0B", 
                        "background-light": "#F3F4F6", 
                        "background-dark": "#0F172A", 
                        "surface-light": "#FFFFFF",
                        "surface-dark": "#1E293B", 
                        "border-light": "#E2E8F0", 
                        "border-dark": "#334155", 
                        "card-light": "#FFFFFF",
                        "card-dark": "#1F2937",
                    },
                    fontFamily: {
                        sans: ["Spline Sans", "Inter", "sans-serif"], // Theme instruction: Spline Sans
                        display: ["Spline Sans", "Inter", "sans-serif"],
                        body: ["Spline Sans", "Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0.5rem",
                        // Theme instruction: roundness rounded-full for buttons/badges often implies larger radius, 
                        // but sticking to instructions "Roundness: rounded-full" primarily applies to specific elements or global vibe.
                        // We will apply rounded-full to buttons specifically where appropriate or keep the existing structure but update radius variables if needed.
                    },
                },
            },
        };
    </script>
    <style>
        /* Loading Spline Sans just in case, though Inter is in links. Let's use Google Fonts for Spline Sans */
        @import url('https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&display=swap');
        
        body { font-family: 'Spline Sans', sans-serif; }
        
        /* Custom scrollbar for dark mode */
        .dark ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .dark ::-webkit-scrollbar-track {
            background: #1e293b; 
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }
    </style>
    
    <!-- React Dependencies -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/history@5/umd/history.development.js"></script>
    <script src="https://unpkg.com/react-router@6.3.0/umd/react-router.development.js"></script>
    <script src="https://unpkg.com/react-router-dom@6.3.0/umd/react-router-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-800 dark:text-slate-200 min-h-screen transition-colors duration-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { createRoot } = ReactDOM;
        const { MemoryRouter, Routes, Route, Link, useNavigate, useLocation, useParams } = ReactRouterDOM;

        // --- Shared Components ---

        const Sidebar = ({ activePath, requests = [] }) => {
            const pendingCount = requests.filter(r => r.status === 'Pending').length;

            const navItems = [
                { path: "/", icon: "dashboard", label: "Dashboard" },
                { path: "/new-request", icon: "add_circle_outline", label: "New Request" },
                { path: "/status", icon: "history", label: "Request Status" },
                { path: "/approval", icon: "admin_panel_settings", label: "Admin Approval" },
            ];

            return (
                <aside className="w-64 flex-shrink-0 hidden lg:flex flex-col border-r border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark h-full">
                    <nav className="space-y-1 p-4">
                        {navItems.map((item) => {
                            const isActive = activePath === item.path;
                            return (
                                <Link 
                                    key={item.path}
                                    to={item.path} 
                                    className={`${isActive 
                                        ? "bg-primary/10 text-primary" 
                                        : "text-slate-600 hover:bg-slate-50 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white"} 
                                        group flex items-center px-3 py-2 text-sm font-medium rounded-full transition-colors`}
                                >
                                    <span className="material-icons-outlined mr-3 text-lg">{item.icon}</span>
                                    {item.label}
                                </Link>
                            );
                        })}
                    </nav>
                    
                    <div className="mx-4 mt-auto mb-8 bg-slate-50 dark:bg-slate-800 rounded-2xl p-4 border border-border-light dark:border-border-dark shadow-sm">
                        <h3 className="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-3">Quick Notifications</h3>
                        <ul className="space-y-3">
                            <li className="flex items-start">
                                <span className="material-icons-outlined text-warning text-sm mt-0.5 mr-2">pending_actions</span>
                                <span className="text-sm text-slate-600 dark:text-slate-300">Pending Approval: <span className="font-bold text-slate-900 dark:text-white">{pendingCount}</span></span>
                            </li>
                            <li className="flex items-start">
                                <span className="material-icons-outlined text-primary text-sm mt-0.5 mr-2">fact_check</span>
                                <span className="text-sm text-slate-600 dark:text-slate-300">Awaiting IT Review</span>
                            </li>
                        </ul>
                    </div>
                </aside>
            );
        };

        const Header = () => {
            return (
                <header className="bg-surface-light dark:bg-surface-dark border-b border-border-light dark:border-border-dark shadow-sm z-10 sticky top-0">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex justify-between h-16">
                            <div className="flex items-center">
                                <Link to="/" className="flex-shrink-0 flex items-center group">
                                    <span className="material-icons-outlined text-primary text-3xl mr-2 group-hover:rotate-12 transition-transform">dns</span>
                                    <h1 className="text-xl font-bold text-slate-900 dark:text-white">IT Request Portal</h1>
                                </Link>
                            </div>
                            <div className="flex items-center space-x-4">
                                <button className="p-2 rounded-full text-slate-500 hover:text-primary dark:text-slate-400 dark:hover:text-white focus:outline-none transition-colors">
                                    <span className="material-icons-outlined">notifications</span>
                                </button>
                                <div className="flex items-center gap-2 cursor-pointer group">
                                    <img alt="User Avatar" className="h-8 w-8 rounded-full border border-border-light dark:border-border-dark" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCGExZziHA3V9JtfA5r4PgeRezeULfohGCbapUm0knqzJ3gt3IR6shOSpaPNiaFzPVcOD-wYXsNTA7TgtfcEme8LgQraRschdWDMbqTRobN03B45EgAbhFkdNuXzOHpZiVmZ6hmLvwkrW9ssX__Rg45DifMk5d3KS4aU3f2mqhn7gjCFqelMYyCxz_hGSTNv2UfXPLA5FYycD90H6wFU2W__irTyEtgRvyGK4lYpzJ7Pr3JmklnMt5vmgxyKZoRb0fPdNh2Azb_jDil"/>
                                    <span className="text-sm font-medium text-slate-700 dark:text-slate-300 group-hover:text-primary transition-colors">John Doe</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </header>
            );
        };

        const ModeToggle = () => {
            const [isDark, setIsDark] = useState(true);

            useEffect(() => {
                const html = document.documentElement;
                if (isDark) {
                    html.classList.add('dark');
                } else {
                    html.classList.remove('dark');
                }
            }, [isDark]);

            return (
                <button 
                    className="fixed bottom-6 right-6 z-50 bg-slate-800 dark:bg-white text-white dark:text-slate-800 p-3 rounded-full shadow-lg hover:scale-110 transition-transform focus:outline-none" 
                    onClick={() => setIsDark(!isDark)}
                >
                    {isDark ? (
                        <span className="material-icons-round block">light_mode</span>
                    ) : (
                        <span className="material-icons-round block">dark_mode</span>
                    )}
                </button>
            );
        };

        // --- Page 1: Dashboard ---

        const DashboardPage = ({ requests }) => {
            const chartRef = useRef(null);
            
            // Calculate dynamic stats
            const total = requests.length;
            const pending = requests.filter(r => r.status === 'Pending').length;
            const approved = requests.filter(r => r.status === 'Approved').length;
            const rejected = requests.filter(r => r.status === 'Rejected').length;

            useEffect(() => {
                let chartInstance = null;
                if (chartRef.current) {
                    const ctx = chartRef.current.getContext('2d');
                    
                    // Simple logic to count requests by status for the chart
                    const dataValues = [pending, approved, rejected, total];
                    
                    chartInstance = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: ['Pending', 'Approved', 'Rejected', 'Total'],
                            datasets: [{
                                label: 'Requests',
                                data: dataValues,
                                backgroundColor: ['#F59E0B', '#10B981', '#EF4444', '#64748B'], 
                                borderRadius: 4,
                                hoverBackgroundColor: '#38e07b'
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    grid: { color: 'rgba(148, 163, 184, 0.1)', drawBorder: false },
                                    ticks: { color: '#94A3B8' }
                                },
                                x: {
                                    grid: { display: false },
                                    ticks: { color: '#94A3B8' }
                                }
                            },
                            plugins: { legend: { display: false } }
                        }
                    });
                }
                return () => {
                    if (chartInstance) chartInstance.destroy();
                }
            }, [requests, pending, approved, rejected, total]);

            return (
                <div className="flex-1 space-y-8 p-8 max-w-7xl mx-auto w-full">
                    <section>
                        <h2 className="text-2xl font-bold text-slate-900 dark:text-white mb-6">Dashboard Overview</h2>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                            {[
                                { title: "All Requests", count: total, icon: "folder_open", colorClass: "bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300" },
                                { title: "Pending", count: pending, icon: "hourglass_empty", colorClass: "bg-warning/10 text-warning" },
                                { title: "Approved", count: approved, icon: "check_circle", colorClass: "bg-success/10 text-success" },
                                { title: "Rejected", count: rejected, icon: "cancel", colorClass: "bg-danger/10 text-danger" },
                            ].map((stat, i) => (
                                <div key={i} className="bg-surface-light dark:bg-surface-dark rounded-xl p-5 shadow-sm border border-border-light dark:border-border-dark transition-all hover:shadow-md">
                                    <div className="flex items-center">
                                        <div className={`p-3 rounded-full ${stat.colorClass}`}>
                                            <span className="material-icons-outlined">{stat.icon}</span>
                                        </div>
                                        <div className="ml-4">
                                            <p className="text-sm font-medium text-slate-500 dark:text-slate-400">{stat.title}</p>
                                            <p className="text-2xl font-bold text-slate-900 dark:text-white">{stat.count}</p>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                        <div className="bg-surface-light dark:bg-surface-dark rounded-xl shadow-sm border border-border-light dark:border-border-dark p-6">
                            <h3 className="text-lg font-semibold text-slate-900 dark:text-white mb-4">Request Statistics</h3>
                            <div className="h-64 w-full">
                                <canvas ref={chartRef}></canvas>
                            </div>
                        </div>
                    </section>
                </div>
            );
        };

        // --- Page 2: New Request Form ---

        const NewRequestPage = ({ addRequest }) => {
            const navigate = useNavigate();
            const [showPopup, setShowPopup] = useState(false);
            const [popupStatus, setPopupStatus] = useState(null); // 'success' or 'error'
            const [errors, setErrors] = useState({});

            const handleSubmit = (e) => {
                e.preventDefault();
                const form = e.target;
                
                // Extracting values
                const requester = form.querySelector('select[name="requester"]').value;
                const deviceType = form.querySelector('select[name="device"]').value;
                const quantity = form.querySelector('input[name="quantity"]').value;
                const reasonInput = form.querySelector('textarea');
                const reason = reasonInput.value;

                // Validation logic
                const newErrors = {};
                // Force failure if reason is empty to demonstrate the error UI
                if (!reason || reason.trim() === "") {
                    newErrors.reason = "Reason cannot be empty.";
                }

                if (Object.keys(newErrors).length > 0) {
                    setErrors(newErrors);
                    setPopupStatus('error');
                    setShowPopup(true);
                    // Hide popup after 5 seconds
                    setTimeout(() => setShowPopup(false), 5000);
                    return;
                }

                // If valid, clear errors
                setErrors({});
                
                // Map device type to icon
                let icon = 'devices';
                if(deviceType === 'Notebook') icon = 'laptop_mac';
                if(deviceType === 'Monitor') icon = 'desktop_windows';
                if(deviceType === 'Peripheral') icon = 'mouse';

                const newRequest = {
                    item: deviceType,
                    requester: requester,
                    quantity: quantity,
                    icon: icon,
                    reason: reason,
                    status: 'Pending'
                };

                // Show success popup
                setPopupStatus('success');
                setShowPopup(true);

                // Delay to show popup before navigation
                setTimeout(() => {
                    addRequest(newRequest);
                    navigate('/status');
                }, 2000);
            };

            return (
                <div className="flex items-center justify-center p-4 w-full h-full min-h-[calc(100vh-4rem)] relative">
                    {/* Popup Notification */}
                    {showPopup && (
                        <div className={`fixed top-24 right-4 md:right-10 z-50 flex items-center p-4 rounded-xl shadow-2xl border transition-all duration-300 animate-bounce ${
                            popupStatus === 'success' 
                            ? "bg-white dark:bg-slate-800 border-emerald-500 text-emerald-600 dark:text-emerald-400" 
                            : "bg-white dark:bg-slate-800 border-red-500 text-red-600 dark:text-red-400"
                        }`}>
                            <span className="material-icons-round text-3xl mr-3">
                                {popupStatus === 'success' ? 'check_circle' : 'error'}
                            </span>
                            <div>
                                <h3 className="font-bold text-lg">{popupStatus === 'success' ? 'Request Submitted' : 'Submission Failed'}</h3>
                                <p className="text-sm font-medium text-slate-600 dark:text-slate-300">
                                    {popupStatus === 'success' ? 'Data added to Request Status. Waiting for Admin confirmation.' : 'Please fix the errors highlighted below.'}
                                </p>
                            </div>
                        </div>
                    )}

                    <div className="w-full max-w-3xl bg-card-light dark:bg-card-dark rounded-2xl shadow-xl border border-gray-200 dark:border-gray-700 overflow-hidden transition-colors duration-200">
                        <div className="bg-gray-50 dark:bg-gray-800/50 px-8 py-5 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <span className="material-icons-round text-primary text-2xl">post_add</span>
                                <h1 className="text-xl font-bold text-gray-900 dark:text-white tracking-tight">New IT Request</h1>
                            </div>
                             <div className="hidden sm:flex gap-2">
                                <div className="w-3 h-3 rounded-full bg-red-400"></div>
                                <div className="w-3 h-3 rounded-full bg-yellow-400"></div>
                                <div className="w-3 h-3 rounded-full bg-green-400"></div>
                            </div>
                        </div>
                        <form onSubmit={handleSubmit} className="p-8 space-y-8">
                            {/* Requester Field */}
                            <div className="grid grid-cols-1 md:grid-cols-12 gap-4 md:items-center">
                                <label className="md:col-span-3 block text-sm font-semibold text-gray-700 dark:text-gray-300">Requester:</label>
                                <div className="md:col-span-9 relative">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <span className="material-icons-round text-gray-400 text-lg">person</span>
                                    </div>
                                    <select name="requester" className="pl-10 block w-full rounded-full border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm focus:border-primary focus:ring-primary sm:text-sm transition-colors">
                                        <option>John Doe</option>
                                        <option>Jane Smith</option>
                                        <option>Alex Johnson</option>
                                    </select>
                                </div>
                            </div>

                            {/* Department Field */}
                            <div className="grid grid-cols-1 md:grid-cols-12 gap-4 md:items-center">
                                <label className="md:col-span-3 block text-sm font-semibold text-gray-700 dark:text-gray-300">Department:</label>
                                <div className="md:col-span-9 relative">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <span className="material-icons-round text-gray-400 text-lg">business</span>
                                    </div>
                                    <select className="pl-10 block w-full rounded-full border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm focus:border-primary focus:ring-primary sm:text-sm transition-colors">
                                        <option>IT</option>
                                        <option>Human Resources</option>
                                        <option>Finance</option>
                                        <option>Marketing</option>
                                        <option>Operations</option>
                                        <option>Production</option>
                                        <option>Purchasing</option>
                                        <option>Quality</option>
                                        <option>Research and Development</option>
                                        <option>Sales</option>
                                        <option>Supply Chain</option>
                                        
                                    </select>
                                </div>
                            </div>

                            <hr className="border-gray-200 dark:border-gray-700 my-6"/>

                            {/* Device & Quantity */}
                            <div className="grid grid-cols-1 md:grid-cols-12 gap-4 md:items-center">
                                <label className="md:col-span-3 block text-sm font-semibold text-gray-700 dark:text-gray-300">Device Type:</label>
                                <div className="md:col-span-9 relative">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <span className="material-icons-round text-gray-400 text-lg">laptop_mac</span>
                                    </div>
                                    <select name="device" className="pl-10 block w-full rounded-full border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm focus:border-primary focus:ring-primary sm:text-sm transition-colors">
                                        <option>Notebook</option>
                                        <option>Monitor</option>
                                        <option>Peripheral</option>
                                        <option>Printer</option>
                                        <option>Scanner</option>
                                        <option>Server</option>
                                        <option>Storage</option>
                                        <option>Tablet</option>
                                        <option>Workstation</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div className="grid grid-cols-1 md:grid-cols-12 gap-4 md:items-center">
                                <label className="md:col-span-3 block text-sm font-semibold text-gray-700 dark:text-gray-300">Quantity:</label>
                                <div className="md:col-span-3 relative">
                                    <input name="quantity" className="block w-full rounded-full border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm focus:border-primary focus:ring-primary sm:text-sm transition-colors" type="number" defaultValue="1" min="1"/>
                                </div>
                            </div>

                            {/* Reason */}
                            <div className="grid grid-cols-1 md:grid-cols-12 gap-4">
                                <label className="md:col-span-3 block text-sm font-semibold text-gray-700 dark:text-gray-300 pt-2">Reason:</label>
                                <div className="md:col-span-9">
                                    <textarea 
                                        className={`block w-full rounded-2xl ${errors.reason ? 'border-red-500 focus:border-red-500 ring-1 ring-red-500' : 'border-gray-300 dark:border-gray-600 focus:border-primary focus:ring-primary'} 
                                        bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm sm:text-sm transition-colors resize-none`} 
                                        rows="4" 
                                        placeholder="Please describe why this equipment is needed..."></textarea>
                                    {/* Error Message Below Field */}
                                    {errors.reason && (
                                        <div className="mt-2 p-3 bg-red-50 dark:bg-red-900/20 border border-red-100 dark:border-red-800 rounded-lg animate-pulse">
                                            <p className="text-sm text-red-600 dark:text-red-400 font-bold flex items-center">
                                                <span className="material-icons-round text-sm mr-1">warning</span>
                                                {errors.reason}
                                            </p>
                                            <p className="text-xs text-red-500 dark:text-red-300 mt-1 pl-5">
                                                Tip: Please enter a detailed business justification to proceed.
                                            </p>
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* File Upload */}
                            <div className="grid grid-cols-1 md:grid-cols-12 gap-4 md:items-center">
                                <label className="md:col-span-3 block text-sm font-semibold text-gray-700 dark:text-gray-300">Attachment:</label>
                                <div className="md:col-span-9">
                                    <label className="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 dark:bg-gray-700 hover:bg-gray-100 dark:hover:bg-gray-600 dark:border-gray-500 transition-colors">
                                        <div className="flex flex-col items-center justify-center pt-5 pb-6">
                                            <span className="material-icons-round text-gray-400 text-3xl mb-2">cloud_upload</span>
                                            <p className="mb-2 text-sm text-gray-500 dark:text-gray-400"><span className="font-semibold">Click to upload</span></p>
                                        </div>
                                        <input className="hidden" type="file"/>
                                    </label>
                                </div>
                            </div>

                            <div className="flex justify-end gap-4 pt-4 border-t border-gray-200 dark:border-gray-700">
                                <button type="button" onClick={() => navigate('/')} className="text-gray-600 dark:text-gray-400 hover:text-gray-800 dark:hover:text-gray-200 text-sm font-medium">Cancel</button>
                                <button type="submit" className="bg-primary hover:bg-primary-hover text-white font-medium py-2.5 px-6 rounded-full shadow-md flex items-center justify-center gap-2 transition-colors">
                                    <span>Submit Request</span>
                                    <span className="material-icons-round text-sm">send</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        // --- Page 3: Request Status Table ---

        const StatusPage = ({ requests }) => {
            // Sort requests by createdAt (descending) so newest are first
            const sortedRequests = [...requests].sort((a, b) => b.createdAt - a.createdAt);

            const getStatusClass = (status) => {
                switch(status) {
                    case 'Approved':
                        return "bg-emerald-100 text-emerald-800 dark:bg-emerald-900/30 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800";
                    case 'Rejected':
                        return "bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-300 border border-red-200 dark:border-red-800";
                    case 'Pending':
                    default:
                        return "bg-slate-100 text-slate-800 dark:bg-slate-700 dark:text-slate-300";
                }
            };

            const formatDate = (dateObj) => {
                if(!dateObj) return "";
                return dateObj.toLocaleString('en-US', { 
                    year: '2-digit', month: 'numeric', day: 'numeric', 
                    hour: 'numeric', minute: 'numeric' 
                });
            }

            return (
                <div className="flex-1 overflow-auto p-6 sm:p-8 bg-background-light dark:bg-background-dark w-full">
                    <header className="mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <h2 className="text-xl font-bold text-slate-800 dark:text-white">Request Status</h2>
                        <div className="flex items-center space-x-2">
                             <div className="relative">
                                <span className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <span className="material-icons-round text-slate-400 text-lg">search</span>
                                </span>
                                <input className="block w-64 pl-10 pr-3 py-2 border border-border-light dark:border-border-dark rounded-full leading-5 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary sm:text-sm transition-colors" placeholder="Search requests..." type="text"/>
                            </div>
                            <Link to="/new-request" className="flex items-center px-4 py-2 bg-primary text-white rounded-full text-sm font-medium hover:bg-primary-hover transition-colors shadow-sm">
                                <span className="material-icons-round mr-1 text-base">add</span> New
                            </Link>
                        </div>
                    </header>

                    <div className="bg-surface-light dark:bg-surface-dark shadow-sm ring-1 ring-border-light dark:ring-border-dark rounded-xl overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="min-w-full divide-y divide-border-light dark:divide-border-dark">
                                <thead className="bg-slate-50 dark:bg-slate-800/50">
                                    <tr>
                                        {["Request ID", "Item", "Requester", "Date/Time", "Status", ""].map((h, i) => (
                                            <th key={i} className="px-6 py-4 text-left text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">{h}</th>
                                        ))}
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-border-light dark:divide-border-dark bg-surface-light dark:bg-surface-dark">
                                    {sortedRequests.map((r) => (
                                        <tr key={r.id} className="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
                                            <td className="px-6 py-4 whitespace-nowrap text-sm font-medium text-primary">{r.id}</td>
                                            <td className="px-6 py-4 whitespace-nowrap text-sm text-slate-700 dark:text-slate-300">
                                                <div className="flex items-center">
                                                    <span className="material-icons-round text-slate-400 mr-2 text-lg">{r.icon}</span>
                                                    {r.item}
                                                </div>
                                            </td>
                                            <td className="px-6 py-4 whitespace-nowrap text-sm text-slate-500 dark:text-slate-400">{r.requester}</td>
                                            <td className="px-6 py-4 whitespace-nowrap text-sm text-slate-500 dark:text-slate-400">{formatDate(r.createdAt)}</td>
                                            <td className="px-6 py-4 whitespace-nowrap">
                                                <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium border border-transparent ${getStatusClass(r.status)}`}>
                                                    {r.status}
                                                </span>
                                            </td>
                                            <td className="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                                <Link to={`/approval/${r.id.replace('#', '')}`} className="text-slate-400 hover:text-primary transition-colors">
                                                    <span className="material-icons-round">arrow_forward</span>
                                                </Link>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Page 4: Approval Detail ---

        const ApprovalPage = ({ requests, updateStatus }) => {
            const navigate = useNavigate();
            const { id } = useParams();
            
            // Find request by ID (matching without hash if needed) or default to first pending if no ID
            let currentRequest = null;
            if (id) {
                currentRequest = requests.find(r => r.id.replace('#', '') === id);
            }
            if (!currentRequest) {
                // Fallback for demo if accessed directly
                currentRequest = requests.find(r => r.status === 'Pending');
            }

            if (!currentRequest) {
                return (
                     <div className="flex items-center justify-center h-full min-h-[50vh]">
                        <div className="text-center">
                            <h3 className="text-lg font-medium text-slate-900 dark:text-white">No pending requests found</h3>
                            <button onClick={() => navigate('/status')} className="mt-4 text-primary hover:underline">Go back to Status</button>
                        </div>
                     </div>
                );
            }

            const handleAction = (type) => {
                 if(updateStatus) {
                     updateStatus(currentRequest.id, type);
                 }
                //  alert(`Request ${type}!`);
                 navigate('/status');
            }

            return (
                <div className="flex items-center justify-center p-4 w-full h-full min-h-[calc(100vh-4rem)]">
                    <div className="w-full max-w-2xl bg-surface-light dark:bg-surface-dark shadow-xl rounded-2xl border border-border-light dark:border-border-dark overflow-hidden transition-colors duration-200">
                        <div className="px-6 py-5 border-b border-border-light dark:border-border-dark flex justify-between items-center bg-gray-50 dark:bg-gray-800/50">
                            <div className="flex items-center">
                                <button 
                                    onClick={() => navigate(-1)} 
                                    className="mr-3 p-2 rounded-full text-slate-500 hover:bg-slate-200 dark:text-slate-400 dark:hover:bg-slate-700 transition-colors"
                                    aria-label="Go back"
                                >
                                    <span className="material-icons-round block">arrow_back</span>
                                </button>
                                <h1 className="text-xl font-bold text-gray-800 dark:text-white flex items-center gap-2">
                                    <span className="material-icons text-primary">assignment_turned_in</span>
                                    Approval Request {currentRequest.id}
                                </h1>
                            </div>
                            <span className={`px-3 py-1 rounded-full text-xs font-semibold border ${
                                currentRequest.status === 'Pending' ? 'bg-yellow-100 text-yellow-800 dark:bg-yellow-900/30 dark:text-yellow-200 border-yellow-200 dark:border-yellow-800' :
                                currentRequest.status === 'Approved' ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/30 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800' :
                                'bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-300 border-red-200 dark:border-red-800'
                            }`}>
                                {currentRequest.status}
                            </span>
                        </div>
                        <div className="p-6 space-y-8">
                            <div className="space-y-6">
                                <div className="flex flex-col sm:flex-row sm:items-baseline">
                                    <label className="text-sm font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide w-32 shrink-0">Request</label>
                                    <div className="mt-1 sm:mt-0 text-lg font-medium text-gray-900 dark:text-white flex items-center gap-2">
                                        <span className="material-icons text-gray-400 dark:text-gray-500 text-base">{currentRequest.icon}</span>
                                        {currentRequest.item}
                                    </div>
                                </div>
                                <hr className="border-border-light dark:border-border-dark border-dashed"/>
                                <div className="flex flex-col sm:flex-row sm:items-baseline">
                                    <label className="text-sm font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide w-32 shrink-0">Reason</label>
                                    <div className="mt-1 sm:mt-0 text-base text-gray-700 dark:text-gray-300 leading-relaxed">
                                        {currentRequest.reason || "For new project development requiring high-performance computing resources for local rendering and compilation tasks."}
                                    </div>
                                </div>
                                <hr className="border-border-light dark:border-border-dark border-dashed"/>
                                <div className="flex flex-col sm:flex-row sm:items-baseline">
                                    <label className="text-sm font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide w-32 shrink-0">Requester</label>
                                    <div className="mt-1 sm:mt-0 flex items-center gap-2">
                                        <div className="h-6 w-6 rounded-full bg-primary text-white flex items-center justify-center text-xs font-bold">
                                            {currentRequest.requester.split(' ').map(n=>n[0]).join('')}
                                        </div>
                                        <span className="text-base text-gray-700 dark:text-gray-300">{currentRequest.requester}</span>
                                    </div>
                                </div>
                            </div>
                            
                            {currentRequest.status === 'Pending' && (
                                <div className="flex flex-col sm:flex-row gap-4 mt-8 pt-4">
                                    <button onClick={() => handleAction('Approved')} className="flex-1 inline-flex justify-center items-center gap-2 px-6 py-3 border border-transparent text-base font-medium rounded-full shadow-sm text-white bg-primary hover:bg-primary-hover transition-colors" type="button">
                                        <span className="material-icons text-sm">check_circle</span>
                                        Approve
                                    </button>
                                    <button onClick={() => handleAction('Rejected')} className="flex-1 inline-flex justify-center items-center gap-2 px-6 py-3 border border-transparent text-base font-medium rounded-full shadow-sm text-white bg-danger hover:bg-red-600 transition-colors" type="button">
                                        <span className="material-icons text-sm">cancel</span>
                                        Reject
                                    </button>
                                </div>
                            )}
                            {currentRequest.status !== 'Pending' && (
                                <div className="mt-8 pt-4 text-center">
                                    <p className="text-slate-500">This request has been {currentRequest.status.toLowerCase()}.</p>
                                </div>
                            )}
                        </div>
                         <div className="bg-gray-50 dark:bg-gray-800/50 px-6 py-6 border-t border-border-light dark:border-border-dark">
                            <div className="flex flex-col sm:flex-row gap-4">
                                <label className="text-sm font-semibold text-gray-700 dark:text-gray-300 pt-2 w-32 shrink-0" htmlFor="comment">Comment:</label>
                                <div className="w-full">
                                    <textarea className="shadow-sm block w-full focus:ring-primary focus:border-primary sm:text-sm bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-2xl text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 transition-colors" id="comment" name="comment" placeholder="Optional comments..." rows="3"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Layout Wrapper ---

        const Layout = ({ children, requests }) => {
            const location = useLocation();
            return (
                <div className="min-h-screen flex flex-col">
                    <Header />
                    <div className="flex flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 gap-8">
                        <Sidebar activePath={location.pathname} requests={requests} />
                        <main className="flex-1 flex flex-col">
                            {children}
                        </main>
                    </div>
                    <ModeToggle />
                </div>
            );
        }

        // --- App Component ---

        const App = () => {
            // Using real Date objects for sorting
            const [requests, setRequests] = useState([
                // { id: "#00123", item: "Laptop (MacBook Pro)", requester: "Sarah Smith", createdAt: new Date(2022, 0, 1, 9, 30), status: "Pending", icon: "laptop_mac", reason: "Current laptop screen is broken." },
                // { id: "#00124", item: "Wireless Mouse", requester: "Mike Johnson", createdAt: new Date(2021, 11, 28, 14, 15), status: "Approved", icon: "mouse", reason: "Trackpad not working efficiently for design work." },
                // { id: "#00125", item: "4K Monitor", requester: "Emily Davis", createdAt: new Date(2021, 11, 25, 10, 0), status: "Rejected", icon: "desktop_windows", reason: "Want better resolution for spreadsheets." },
                // { id: "#00126", item: "Mechanical Keyboard", requester: "Alex Chen", createdAt: new Date(2021, 11, 24, 16, 45), status: "Approved", icon: "keyboard", reason: "Ergonomic needs for typing all day." },
                // { id: "#00127", item: "WiFi Repeater", requester: "Jessica Brown", createdAt: new Date(2021, 11, 22, 11, 20), status: "Pending", icon: "router", reason: "Signal weak in corner office." },
            ]);

            const updateStatus = (id, newStatus) => {
                setRequests(prev => prev.map(r => r.id === id ? { ...r, status: newStatus } : r));
            };

            const addRequest = (newRequestData) => {
                // Calculate next ID based on maximum existing ID to avoid collisions
                const maxId = requests.reduce((max, r) => {
                    const idNum = parseInt(r.id.replace(/\D/g, ''), 10);
                    return !isNaN(idNum) && idNum > max ? idNum : max;
                }, 0);
                const nextId = maxId > 0 ? maxId + 1 : 128;

                const newRequest = {
                    ...newRequestData,
                    id: `#${String(nextId).padStart(5, '0')}`,
                    createdAt: new Date() // Current time for "Realtime" sorting
                };
                // Prepend to list
                setRequests(prev => [newRequest, ...prev]);
            };

            return (
                <MemoryRouter>
                    <Layout requests={requests}>
                        <Routes>
                            <Route path="/" element={<DashboardPage requests={requests} />} />
                            <Route path="/new-request" element={<NewRequestPage addRequest={addRequest} />} />
                            <Route path="/status" element={<StatusPage requests={requests} />} />
                            <Route path="/approval" element={<ApprovalPage requests={requests} updateStatus={updateStatus} />} />
                            <Route path="/approval/:id" element={<ApprovalPage requests={requests} updateStatus={updateStatus} />} />
                        </Routes>
                    </Layout>
                </MemoryRouter>
            );
        };

        const root = createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
