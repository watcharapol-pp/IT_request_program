    <script>
        tailwind.config = {

            theme: {
                extend: {
                    colors: {
                        primary: "#38e07b", // Custom Theme Color
                        "primary-hover": "#2ccb69",

                        warning: "#F59E0B",

</head>
<body class="bg-background-light dark:bg-background-dark text-slate-800 dark:text-slate-200 min-h-screen transition-colors duration-200">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { createRoot } = ReactDOM;
        const { MemoryRouter, Routes, Route, Link, useNavigate, useLocation } = ReactRouterDOM;

        // --- Shared Components ---

        const ThemeToggle = () => {
            const [isDark, setIsDark] = useState(true);

            useEffect(() => {
                const html = document.documentElement;
                if (isDark) {
                    html.classList.add('dark');
                } else {
                    html.classList.remove('dark');
                }
            }, [isDark]);

            return (
                <button 
                    onClick={() => setIsDark(!isDark)}
                    className="fixed bottom-6 right-6 z-50 bg-gray-800 dark:bg-white text-white dark:text-gray-800 p-3 rounded-full shadow-lg hover:scale-110 transition-transform focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-800 dark:focus:ring-white"
                >
                    <span className="material-icons-round block dark:hidden">dark_mode</span>
                    <span className="material-icons-round hidden dark:block">light_mode</span>
                </button>
            );
        };

        const NavSidebar = ({ active }) => {
            return (
                <aside className="w-64 bg-surface-light dark:bg-surface-dark border-r border-border-light dark:border-border-dark hidden md:flex flex-col h-screen fixed left-0 top-0 z-20">
                    <div className="p-6 border-b border-border-light dark:border-border-dark flex items-center space-x-3">
                        <div className="h-8 w-8 bg-primary rounded-full flex items-center justify-center text-slate-900 font-bold text-lg">IT</div>
                        <h1 className="text-xl font-bold text-slate-900 dark:text-white tracking-tight">IT Portal</h1>
                    </div>
                    <nav className="flex-1 p-4 space-y-1 overflow-y-auto">
                        <Link to="/" className={`flex items-center px-4 py-3 text-sm font-medium rounded-full transition-colors group ${active === 'dashboard' ? 'bg-primary/10 text-primary' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-primary'}`}>
                            <span className={`material-icons-round mr-3 ${active === 'dashboard' ? 'text-primary' : 'text-slate-400 group-hover:text-primary'}`}>dashboard</span>
                            Dashboard
                        </Link>
                        <Link to="/new-request" className={`flex items-center px-4 py-3 text-sm font-medium rounded-full transition-colors group ${active === 'new-request' ? 'bg-primary/10 text-primary' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-primary'}`}>
                            <span className={`material-icons-round mr-3 ${active === 'new-request' ? 'text-primary' : 'text-slate-400 group-hover:text-primary'}`}>add_circle_outline</span>

                        </Link>
                        <Link to="/status" className={`flex items-center px-4 py-3 text-sm font-medium rounded-full transition-colors group ${active === 'status' ? 'bg-primary/10 text-primary' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-primary'}`}>
                            <span className={`material-icons-round mr-3 ${active === 'status' ? 'text-primary' : 'text-slate-400 group-hover:text-primary'}`}>assignment</span>
                            Request Status
                        </Link>
                        <Link to="/approval" className={`flex items-center px-4 py-3 text-sm font-medium rounded-full transition-colors group ${active === 'approval' ? 'bg-primary/10 text-primary' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-primary'}`}>
                             <span className={`material-icons-round mr-3 ${active === 'approval' ? 'text-primary' : 'text-slate-400 group-hover:text-primary'}`}>gavel</span>
                            Approval (Admin)
                        </Link>
                         <Link to="/profile" className={`flex items-center px-4 py-3 text-sm font-medium rounded-full transition-colors group ${active === 'profile' ? 'bg-primary/10 text-primary' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-primary'}`}>
                            <span className={`material-icons-round mr-3 ${active === 'profile' ? 'text-primary' : 'text-slate-400 group-hover:text-primary'}`}>person</span>
                            My Profile
                        </Link>
                    </nav>
                    <div className="p-4 border-t border-border-light dark:border-border-dark">
                        <div className="flex items-center px-4 py-2 space-x-3">
                            <div className="h-9 w-9 rounded-full bg-slate-200 dark:bg-slate-700 flex items-center justify-center text-xs font-bold text-slate-600 dark:text-slate-300">JD</div>
                            <div className="flex-1 min-w-0">
                                <p className="text-sm font-medium text-slate-900 dark:text-white truncate">John Doe</p>
                                <p className="text-xs text-slate-500 dark:text-slate-400 truncate">IT Dept</p>
                            </div>

        // --- Screen Components ---

        // Screen 1: New IT Request Form

            return (

                    <NavSidebar active="new-request" />
                    <div className="flex-1 md:ml-64 flex items-center justify-center p-4">

                            <div className="bg-gray-50 dark:bg-gray-800/50 px-8 py-5 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <span className="material-icons-round text-primary text-2xl">post_add</span>
                                    <h1 className="text-xl font-bold text-gray-900 dark:text-white tracking-tight">New IT Request</h1>
                                </div>
                                <div className="hidden sm:flex gap-2">
                                    <div className="w-3 h-3 rounded-full bg-red-400"></div>
                                    <div className="w-3 h-3 rounded-full bg-yellow-400"></div>
                                    <div className="w-3 h-3 rounded-full bg-green-400"></div>
                                </div>
                            </div>
                            <form onSubmit={handleSubmit} className="p-8 space-y-8">
                                <div className="grid grid-cols-1 md:grid-cols-12 gap-4 md:items-center">
                                    <label className="md:col-span-3 block text-sm font-semibold text-gray-700 dark:text-gray-300" htmlFor="requester">
                                        Requester:
                                    </label>
                                    <div className="md:col-span-9 relative">
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                            <span className="material-icons-round text-gray-400 text-lg">person</span>
                                        </div>
                                        <select className="pl-10 block w-full rounded-full border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm focus:border-primary focus:ring-primary sm:text-sm transition-colors" id="requester" name="requester">
                                            <option>John Doe</option>
                                            <option>Jane Smith</option>
                                            <option>Alex Johnson</option>
                                        </select>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-12 gap-4 md:items-center">
                                    <label className="md:col-span-3 block text-sm font-semibold text-gray-700 dark:text-gray-300" htmlFor="department">
                                        Department:
                                    </label>
                                    <div className="md:col-span-9 relative">
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                            <span className="material-icons-round text-gray-400 text-lg">business</span>
                                        </div>
                                        <select className="pl-10 block w-full rounded-full border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm focus:border-primary focus:ring-primary sm:text-sm transition-colors" id="department" name="department">
                                            <option>IT</option>
                                            <option>Human Resources</option>
                                            <option>Finance</option>
                                            <option>Marketing</option>
                                        </select>
                                    </div>
                                </div>
                                <hr className="border-gray-200 dark:border-gray-700 my-6"/>
                                <div className="grid grid-cols-1 md:grid-cols-12 gap-4 md:items-center">
                                    <label className="md:col-span-3 block text-sm font-semibold text-gray-700 dark:text-gray-300" htmlFor="device-type">
                                        Device Type:
                                    </label>
                                    <div className="md:col-span-9 relative">
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                            <span className="material-icons-round text-gray-400 text-lg">laptop_mac</span>
                                        </div>
                                        <select className="pl-10 block w-full rounded-full border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm focus:border-primary focus:ring-primary sm:text-sm transition-colors" id="device-type" name="device-type">
                                            <option>Notebook</option>
                                            <option>Desktop Workstation</option>
                                            <option>Monitor (27")</option>
                                            <option>Peripheral (Mouse/Keyboard)</option>
                                        </select>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-12 gap-4 md:items-center">
                                    <label className="md:col-span-3 block text-sm font-semibold text-gray-700 dark:text-gray-300" htmlFor="quantity">
                                        Quantity:
                                    </label>
                                    <div className="md:col-span-3 relative">
                                        <input className="block w-full rounded-full border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm focus:border-primary focus:ring-primary sm:text-sm transition-colors" id="quantity" min="1" name="quantity" type="number" defaultValue="1"/>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-12 gap-4">
                                    <label className="md:col-span-3 block text-sm font-semibold text-gray-700 dark:text-gray-300 pt-2" htmlFor="reason">
                                        Reason:
                                    </label>
                                    <div className="md:col-span-9">
                                        <textarea className="block w-full rounded-xl border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm focus:border-primary focus:ring-primary sm:text-sm transition-colors resize-none" id="reason" name="reason" placeholder="Please describe why this equipment is needed..." rows="4"></textarea>
                                        <p className="mt-2 text-xs text-gray-500 dark:text-gray-400">Briefly explain the business justification for this request.</p>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-12 gap-4 md:items-center">
                                    <label className="md:col-span-3 block text-sm font-semibold text-gray-700 dark:text-gray-300" htmlFor="attachment">
                                        Attachment:
                                    </label>
                                    <div className="md:col-span-9">
                                        <div className="flex items-center justify-center w-full">
                                            <label className="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 dark:bg-gray-700 hover:bg-gray-100 dark:hover:bg-gray-600 dark:border-gray-500 transition-colors" htmlFor="dropzone-file">
                                                <div className="flex flex-col items-center justify-center pt-5 pb-6">
                                                    <span className="material-icons-round text-gray-400 text-3xl mb-2">cloud_upload</span>
                                                    <p className="mb-2 text-sm text-gray-500 dark:text-gray-400"><span className="font-semibold">Click to upload</span> or drag and drop</p>
                                                    <p className="text-xs text-gray-500 dark:text-gray-400">PDF, PNG, JPG (MAX. 5MB)</p>
                                                </div>
                                                <input className="hidden" id="dropzone-file" type="file"/>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                                <div className="bg-gray-50 dark:bg-gray-800/50 px-8 py-5 border-t border-gray-200 dark:border-gray-700 flex flex-col sm:flex-row justify-between items-center gap-4 -mx-8 -mb-8 mt-4">
                                    <button onClick={() => navigate('/')} className="text-gray-600 dark:text-gray-400 hover:text-gray-800 dark:hover:text-gray-200 text-sm font-medium transition-colors" type="button">
                                        Cancel
                                    </button>
                                    <button className="w-full sm:w-auto bg-primary hover:bg-primary-hover text-gray-900 font-bold py-2.5 px-6 rounded-full shadow-md hover:shadow-lg transition-all focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary dark:focus:ring-offset-gray-900 flex items-center justify-center gap-2" type="submit">
                                        <span>Submit Request</span>
                                        <span className="material-icons-round text-sm">send</span>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            );
        };

        // Screen 2: Request Status
        const RequestStatusScreen = () => {
            const navigate = useNavigate();
            const [requests, setRequests] = useState([
                { id: '#00123', item: 'Laptop (MacBook Pro)', requester: 'Sarah Smith', date: '01/01/22', status: 'Pending', icon: 'laptop_mac' },
                { id: '#00124', item: 'Wireless Mouse', requester: 'Mike Johnson', date: '28/12/21', status: 'Approved', icon: 'mouse' },
                { id: '#00125', item: 'Monitor 27"', requester: 'Jane Doe', date: '10/01/22', status: 'Rejected', icon: 'monitor' },
                { id: '#00126', item: 'Mechanical Keyboard', requester: 'Paul Walker', date: '15/01/22', status: 'Pending', icon: 'keyboard' },
                { id: '#00127', item: 'Docking Station', requester: 'Sarah Smith', date: '18/01/22', status: 'Approved', icon: 'dock' },
            ]);
            const [filterStatus, setFilterStatus] = useState('All');
            const [searchTerm, setSearchTerm] = useState('');

            const filteredRequests = requests.filter(req => {
                const matchesStatus = filterStatus === 'All' || req.status === filterStatus;
                const searchLower = searchTerm.toLowerCase();
                const matchesSearch = 
                    req.item.toLowerCase().includes(searchLower) || 
                    req.requester.toLowerCase().includes(searchLower) ||
                    req.id.toLowerCase().includes(searchLower);
                return matchesStatus && matchesSearch;
            });

            const getStatusColor = (status) => {
                switch(status) {
                    case 'Approved': return 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/30 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800';
                    case 'Rejected': return 'bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-300 border border-red-200 dark:border-red-800';
                    case 'Pending': return 'bg-blue-100 text-blue-800 dark:bg-blue-900/30 dark:text-blue-300 border border-blue-200 dark:border-blue-800';
                    default: return 'bg-slate-100 text-slate-800 dark:bg-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-600';
                }
            };

            // Navigate to approval screen for status updates
            const handleStatusClick = (id) => {
                // Find request and open modal instead of navigating
                const req = requests.find(r => r.id === id);
                if (req) setSelectedRequest(req);
            };

            const [selectedRequest, setSelectedRequest] = useState(null);

            const updateRequestStatus = (status) => {
                if (!selectedRequest) return;
                
                const updatedRequests = requests.map(req => {
                    if (req.id === selectedRequest.id) {
                        return { ...req, status: status };
                    }
                    return req;
                });
                
                setRequests(updatedRequests);
                // Also update the selected request so the modal reflects the change immediately if kept open, 
                // or close it. Here we close it to confirm action.
                setSelectedRequest(null);
            };

            return (
                <div className="flex h-screen overflow-hidden bg-background-light dark:bg-background-dark">
                    {selectedRequest && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
                            <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden border border-gray-200 dark:border-gray-700 transform transition-all">
                                <div className="px-6 py-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-800/50">
                                    <h3 className="text-lg font-bold text-gray-900 dark:text-white flex items-center gap-2">
                                        <span className="material-icons-round text-primary">info</span>
                                        Request Details
                                    </h3>
                                    <button onClick={() => setSelectedRequest(null)} className="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 transition-colors">
                                        <span className="material-icons-round">close</span>
                                    </button>
                                </div>
                                <div className="p-6 space-y-4">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <p className="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Request ID</p>
                                            <p className="font-medium text-gray-900 dark:text-white mt-1">{selectedRequest.id}</p>
                                        </div>
                                        <div>
                                            <p className="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Date</p>
                                            <p className="font-medium text-gray-900 dark:text-white mt-1">{selectedRequest.date}</p>
                                        </div>
                                    </div>
                                    <div>
                                        <p className="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Item</p>
                                        <div className="flex items-center gap-2 mt-1">
                                            <span className="material-icons-round text-primary">{selectedRequest.icon}</span>
                                            <span className="font-medium text-gray-900 dark:text-white">{selectedRequest.item}</span>
                                        </div>
                                    </div>
                                    <div>
                                        <p className="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Requester</p>
                                        <div className="flex items-center gap-2 mt-1">
                                            <div className="h-6 w-6 rounded-full bg-slate-200 dark:bg-slate-700 flex items-center justify-center text-[10px] font-bold text-slate-600 dark:text-slate-300">JD</div>
                                            <span className="font-medium text-gray-900 dark:text-white">{selectedRequest.requester}</span>
                                        </div>
                                    </div>
                                    <div>
                                        <p className="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Status</p>
                                        <div className="mt-1">
                                            <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${getStatusColor(selectedRequest.status)}`}>
                                                {selectedRequest.status}
                                            </span>
                                        </div>
                                    </div>
                                    <div className="pt-4 border-t border-gray-100 dark:border-gray-700">
                                        <p className="text-sm font-medium text-gray-900 dark:text-white mb-2">Description</p>
                                        <p className="text-sm text-gray-600 dark:text-gray-400 leading-relaxed bg-gray-50 dark:bg-gray-900/50 p-3 rounded-lg border border-gray-100 dark:border-gray-700">
                                            Request for {selectedRequest.item}. This equipment is required for upcoming projects and daily operations. Justification has been provided in the initial submission.
                                        </p>
                                    </div>
                                    <div className="pt-4 border-t border-gray-100 dark:border-gray-700">
                                         <p className="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">Update Status</p>
                                         <div className="flex flex-wrap gap-2">
                                            <button 
                                                onClick={() => updateRequestStatus('Approved')}
                                                className="flex-1 flex items-center justify-center gap-2 px-3 py-2 bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-800 rounded-lg hover:bg-emerald-200 dark:hover:bg-emerald-900/50 transition-colors text-sm font-medium"
                                            >
                                                <span className="material-icons-round text-sm">check_circle</span> Approve
                                            </button>
                                            <button 
                                                onClick={() => updateRequestStatus('Rejected')}
                                                className="flex-1 flex items-center justify-center gap-2 px-3 py-2 bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400 border border-red-200 dark:border-red-800 rounded-lg hover:bg-red-200 dark:hover:bg-red-900/50 transition-colors text-sm font-medium"
                                            >
                                                <span className="material-icons-round text-sm">cancel</span> Reject
                                            </button>
                                         </div>
                                    </div>
                                </div>
                                <div className="px-6 py-4 bg-gray-50 dark:bg-gray-800/50 border-t border-gray-200 dark:border-gray-700 flex justify-end">
                                    <button onClick={() => setSelectedRequest(null)} className="px-4 py-2 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-sm font-medium hover:bg-gray-50 dark:hover:bg-gray-600 transition-colors text-gray-700 dark:text-gray-200 shadow-sm">
                                        Cancel
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                    <NavSidebar active="status" />
                    <main className="flex-1 flex flex-col h-full overflow-hidden relative md:ml-64">
