<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>IT Service Portal Prototype</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries,typography"></script>
    
    <!-- Fonts and Icons -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round|Material+Icons+Outlined|Material+Symbols+Outlined" rel="stylesheet"/>
    
    <!-- React & Router Dependencies -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/history@5/umd/history.development.js"></script>
    <script src="https://unpkg.com/react-router@6.3.0/umd/react-router.development.js"></script>
    <script src="https://unpkg.com/react-router-dom@6.3.0/umd/react-router-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#38e07b", // Primary per instructions
                        "primary-hover": "#2bc968",
                        secondary: "#64748B",
                        success: "#10B981",
                        danger: "#EF4444",
                        warning: "#F59E0B",
                        "background-light": "#F3F4F6",
                        "background-dark": "#111827",
                        "surface-light": "#FFFFFF",
                        "surface-dark": "#1F2937",
                        "card-light": "#FFFFFF",
                        "card-dark": "#1F2937",
                        "border-light": "#E2E8F0",
                        "border-dark": "#334155",
                    },
                    fontFamily: {
                        sans: ["Spline Sans", "sans-serif"],
                        display: ["Spline Sans", "sans-serif"],
                        body: ["Spline Sans", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "9999px", // Rounded-full per instructions, though usually applies to buttons/chips. 
                        // However, instructions say "Roundness: rounded-full". 
                        // Applying rounded-full globally to everything looks weird for cards, so I will interpret this as 
                        // "Use rounded-full for buttons/badges" but keep standard radius for cards/inputs to match the provided HTML structure mostly.
                        // I will override the default for standard elements to be slightly more rounded if possible, but keeping logic sane.
                        'none': '0',
                        'sm': '0.125rem',
                        DEFAULT: '0.5rem', 
                        'md': '0.375rem',
                        'lg': '0.5rem',
                        'xl': '0.75rem',
                        '2xl': '1rem',
                        '3xl': '1.5rem',
                        'full': '9999px',
                    },
                },
            },
        };
    </script>
    <style>
        body {
            font-family: 'Spline Sans', sans-serif;
        }
        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 20px;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #4b5563;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { createRoot } = ReactDOM;
        const { MemoryRouter, Routes, Route, Link, useNavigate, useLocation } = ReactRouterDOM;

        // --- Common Components ---

        const ThemeToggle = () => {
            const toggleTheme = () => {
                document.documentElement.classList.toggle('dark');
            };
            return (
                <div className="fixed bottom-6 right-6 z-50">
                    <button 
                        className="bg-gray-800 dark:bg-white text-white dark:text-gray-800 p-3 rounded-full shadow-lg hover:scale-110 transition-transform focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-800 dark:focus:ring-white" 
                        onClick={toggleTheme}
                    >
                        <span className="material-icons-round block dark:hidden">dark_mode</span>
                        <span className="material-icons-round hidden dark:block">light_mode</span>
                    </button>
                </div>
            );
        };

        const Sidebar = () => {
            const navigate = useNavigate();
            const location = useLocation();
            
            const isActive = (path) => location.pathname === path;

            return (
                <aside className="w-64 bg-surface-light dark:bg-surface-dark border-r border-border-light dark:border-border-dark hidden md:flex flex-col shadow-sm z-10 h-screen sticky top-0">
                    <div className="h-16 flex items-center px-6 border-b border-border-light dark:border-border-dark">
                        <div className="h-8 w-8 bg-primary rounded-full flex items-center justify-center text-white font-bold text-lg mr-3 shadow-sm">IT</div>
                        <h1 className="text-xl font-bold text-slate-900 dark:text-white tracking-tight">IT Portal</h1>
                    </div>
                    <nav className="flex-1 p-4 space-y-1 overflow-y-auto">
                        <Link to="/" className={`flex items-center px-4 py-3 text-sm font-medium rounded-full transition-colors group ${isActive('/') ? 'bg-primary/10 text-primary' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-primary'}`}>
                            <span className="material-icons-outlined mr-3 text-lg">dashboard</span>
                            Dashboard
                        </Link>
                        <Link to="/new-request" className={`flex items-center px-4 py-3 text-sm font-medium rounded-full transition-colors group ${isActive('/new-request') ? 'bg-primary/10 text-primary' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-primary'}`}>
                            <span className="material-icons-outlined mr-3 text-lg">add_circle_outline</span>
                            New Request
                        </Link>
                        <Link to="/request-status" className={`flex items-center px-4 py-3 text-sm font-medium rounded-full transition-colors group ${isActive('/request-status') ? 'bg-primary/10 text-primary' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-primary'}`}>
                            <span className="material-icons-outlined mr-3 text-lg">history</span>
                            Request Status
                        </Link>
                         <Link to="/approval" className={`flex items-center px-4 py-3 text-sm font-medium rounded-full transition-colors group ${isActive('/approval') ? 'bg-primary/10 text-primary' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-primary'}`}>
                            <span className="material-icons-outlined mr-3 text-lg">fact_check</span>
                            Admin Approval
                        </Link>
                        <Link to="/user-management" className={`flex items-center px-4 py-3 text-sm font-medium rounded-full transition-colors group ${isActive('/user-management') ? 'bg-primary/10 text-primary' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-primary'}`}>
                            <span className="material-icons-outlined mr-3 text-lg">people</span>
                            User Management
                        </Link>
                         <Link to="/profile" className={`flex items-center px-4 py-3 text-sm font-medium rounded-full transition-colors group ${isActive('/profile') ? 'bg-primary/10 text-primary' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-primary'}`}>
                            <span className="material-icons-outlined mr-3 text-lg">account_circle</span>
                            My Profile
                        </Link>
                    </nav>
                    
                    <div className="p-4 border-t border-border-light dark:border-border-dark">
                        <Link to="/profile" className="flex items-center px-3 py-2 space-x-3 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-full transition-colors cursor-pointer">
                            <div className="h-9 w-9 rounded-full bg-slate-200 dark:bg-slate-700 flex items-center justify-center text-xs font-bold text-slate-600 dark:text-slate-300 ring-2 ring-white dark:ring-slate-800">JD</div>
                            <div className="flex-1 min-w-0">
                                <p className="text-sm font-medium text-slate-900 dark:text-white truncate">John Doe</p>
                                <p className="text-xs text-slate-500 dark:text-slate-400 truncate">IT Dept</p>
                            </div>
                        </Link>
                    </div>
                </aside>
            );
        };

        const TopBar = ({ title }) => (
            <header className="bg-surface-light dark:bg-surface-dark border-b border-border-light dark:border-border-dark shadow-sm z-10 sticky top-0 flex md:hidden items-center justify-between px-4 h-16">
                 <div className="flex items-center">
                    <span className="material-icons-outlined text-primary text-3xl mr-2">dns</span>
                    <h1 className="text-xl font-bold text-slate-900 dark:text-white">{title}</h1>
                </div>
                <div className="flex items-center gap-2">
                     <Link to="/profile" className="h-8 w-8 rounded-full bg-slate-200 dark:bg-slate-700 flex items-center justify-center text-xs font-bold">JD</Link>
                </div>
            </header>
        );

        // --- Screen Components ---

        // Screen 1: New IT Request Form
        const NewRequestForm = () => {
            const navigate = useNavigate();
            const [popup, setPopup] = useState({ show: false, type: 'success', title: '', message: '', solution: '' });

            const handleSubmit = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const reason = formData.get('reason');
                const quantity = formData.get('quantity');

                // Validation Logic
                if (!reason || reason.trim() === "") {
                    setPopup({
                        show: true,
                        type: 'error',
                        title: 'Submission Failed',
                        message: 'The "Reason" field is missing.',
                        solution: 'Please describe why this equipment is needed in the "Reason" text box.'
                    });
                    return;
                }

                if (quantity < 1) {
                     setPopup({
                        show: true,
                        type: 'error',
                        title: 'Submission Failed',
                        message: 'Invalid Quantity.',
                        solution: 'Please ensure the quantity is at least 1.'
                    });
                    return;
                }

                // Success
                setPopup({
                    show: true,
                    type: 'success',
                    title: 'Success!',
                    message: 'Your request has been submitted successfully.',
                    solution: ''
                });
            };

            const handleClosePopup = () => {
                if (popup.type === 'success') {
                    setPopup({ ...popup, show: false });
                    navigate('/request-status');
                } else {
                    setPopup({ ...popup, show: false });
                }
            };

            return (
                <div className="flex-1 flex flex-col h-screen overflow-hidden relative">
                    {/* Popup Modal */}
                    {popup.show && (
                        <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
                            <div className={`bg-white dark:bg-surface-dark rounded-2xl shadow-2xl max-w-md w-full overflow-hidden transform transition-all scale-100 border ${popup.type === 'success' ? 'border-green-500' : 'border-red-500'}`}>
                                <div className={`p-4 flex items-center justify-center ${popup.type === 'success' ? 'bg-green-100 dark:bg-green-900/30' : 'bg-red-100 dark:bg-red-900/30'}`}>
                                    <div className={`h-16 w-16 rounded-full flex items-center justify-center ${popup.type === 'success' ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}`}>
                                        <span className="material-icons-round text-4xl">{popup.type === 'success' ? 'check_circle' : 'error'}</span>
                                    </div>
                                </div>
                                <div className="p-6 text-center">
                                    <h3 className={`text-xl font-bold mb-2 ${popup.type === 'success' ? 'text-green-700 dark:text-green-400' : 'text-red-700 dark:text-red-400'}`}>
                                        {popup.title}
                                    </h3>
                                    <p className="text-gray-600 dark:text-gray-300 mb-4 font-medium">
                                        {popup.message}
                                    </p>
                                    {popup.type === 'error' && (
                                        <div className="bg-gray-50 dark:bg-gray-800 rounded-lg p-3 mb-6 text-left text-sm border border-gray-200 dark:border-gray-700">
                                            <p className="font-bold text-gray-700 dark:text-gray-200 mb-1 flex items-center gap-1">
                                                <span className="material-icons-round text-sm text-blue-500">info</span> 
                                                How to fix:
                                            </p>
                                            <p className="text-gray-600 dark:text-gray-400 pl-5">{popup.solution}</p>
                                        </div>
                                    )}
                                    <button 
                                        onClick={handleClosePopup}
                                        className={`w-full py-3 rounded-xl font-bold text-white shadow-md hover:shadow-lg transition-all transform hover:-translate-y-0.5 ${popup.type === 'success' ? 'bg-green-600 hover:bg-green-700' : 'bg-red-600 hover:bg-red-700'}`}
                                    >
                                        {popup.type === 'success' ? 'Go to Status' : 'Try Again'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <TopBar title="New Request" />
                    <div className="flex-1 overflow-auto bg-background-light dark:bg-background-dark p-4 md:p-8 flex items-center justify-center">
                        <div className="w-full max-w-3xl bg-card-light dark:bg-card-dark rounded-xl shadow-xl border border-gray-200 dark:border-gray-700 overflow-hidden transition-colors duration-200">
                            <div className="bg-gray-50 dark:bg-gray-800/50 px-8 py-5 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <span className="material-icons-round text-primary text-2xl">post_add</span>
                                    <h1 className="text-xl font-bold text-gray-900 dark:text-white tracking-tight">New IT Request</h1>
                                </div>
                                <div className="hidden sm:flex gap-2">
                                    <div className="w-3 h-3 rounded-full bg-red-400"></div>
                                    <div className="w-3 h-3 rounded-full bg-yellow-400"></div>
                                    <div className="w-3 h-3 rounded-full bg-green-400"></div>
                                </div>
                            </div>
                            <form onSubmit={handleSubmit} className="p-8 space-y-8">
                                <div className="grid grid-cols-1 md:grid-cols-12 gap-4 md:items-center">
                                    <label className="md:col-span-3 block text-sm font-semibold text-gray-700 dark:text-gray-300" htmlFor="requester">
                                        Requester:
                                    </label>
                                    <div className="md:col-span-9 relative">
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                            <span className="material-icons-round text-gray-400 text-lg">person</span>
                                        </div>
                                        <select className="pl-10 block w-full rounded-full border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm focus:border-primary focus:ring-primary sm:text-sm transition-colors py-2" id="requester" name="requester">
                                            <option>John Doe</option>
                                            <option>Jane Smith</option>
                                            <option>Alex Johnson</option>
                                        </select>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-12 gap-4 md:items-center">
                                    <label className="md:col-span-3 block text-sm font-semibold text-gray-700 dark:text-gray-300" htmlFor="department">
                                        Department:
                                    </label>
                                    <div className="md:col-span-9 relative">
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                            <span className="material-icons-round text-gray-400 text-lg">business</span>
                                        </div>
                                        <select className="pl-10 block w-full rounded-full border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm focus:border-primary focus:ring-primary sm:text-sm transition-colors py-2" id="department" name="department">
                                            <option>IT</option>
                                            <option>Human Resources</option>
                                            <option>Finance</option>
                                            <option>Marketing</option>
                                        </select>
                                    </div>
                                </div>
                                <hr className="border-gray-200 dark:border-gray-700 my-6"/>
                                <div className="grid grid-cols-1 md:grid-cols-12 gap-4 md:items-center">
                                    <label className="md:col-span-3 block text-sm font-semibold text-gray-700 dark:text-gray-300" htmlFor="device-type">
                                        Device Type:
                                    </label>
                                    <div className="md:col-span-9 relative">
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                            <span className="material-icons-round text-gray-400 text-lg">laptop_mac</span>
                                        </div>
                                        <select className="pl-10 block w-full rounded-full border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm focus:border-primary focus:ring-primary sm:text-sm transition-colors py-2" id="device-type" name="device-type">
                                            <option>Notebook</option>
                                            <option>Desktop Workstation</option>
                                            <option>Monitor (27")</option>
                                            <option>Peripheral (Mouse/Keyboard)</option>
                                        </select>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-12 gap-4 md:items-center">
                                    <label className="md:col-span-3 block text-sm font-semibold text-gray-700 dark:text-gray-300" htmlFor="quantity">
                                        Quantity:
                                    </label>
                                    <div className="md:col-span-3 relative">
                                        <input className="block w-full rounded-full border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm focus:border-primary focus:ring-primary sm:text-sm transition-colors px-4 py-2" id="quantity" min="1" name="quantity" type="number" defaultValue="1"/>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-12 gap-4">
                                    <label className="md:col-span-3 block text-sm font-semibold text-gray-700 dark:text-gray-300 pt-2" htmlFor="reason">
                                        Reason:
                                    </label>
                                    <div className="md:col-span-9">
                                        <textarea className="block w-full rounded-xl border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm focus:border-primary focus:ring-primary sm:text-sm transition-colors resize-none p-3" id="reason" name="reason" placeholder="Please describe why this equipment is needed..." rows="4"></textarea>
                                        <p className="mt-2 text-xs text-gray-500 dark:text-gray-400">Briefly explain the business justification for this request.</p>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-12 gap-4 md:items-center">
                                    <label className="md:col-span-3 block text-sm font-semibold text-gray-700 dark:text-gray-300" htmlFor="attachment">
                                        Attachment:
                                    </label>
                                    <div className="md:col-span-9">
                                        <div className="flex items-center justify-center w-full">
                                            <label className="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-300 border-dashed rounded-xl cursor-pointer bg-gray-50 dark:bg-gray-700 hover:bg-gray-100 dark:hover:bg-gray-600 dark:border-gray-500 transition-colors" htmlFor="dropzone-file">
                                                <div className="flex flex-col items-center justify-center pt-5 pb-6">
                                                    <span className="material-icons-round text-gray-400 text-3xl mb-2">cloud_upload</span>
                                                    <p className="mb-2 text-sm text-gray-500 dark:text-gray-400"><span className="font-semibold">Click to upload</span> or drag and drop</p>
                                                    <p className="text-xs text-gray-500 dark:text-gray-400">PDF, PNG, JPG (MAX. 5MB)</p>
                                                </div>
                                                <input className="hidden" id="dropzone-file" type="file"/>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                                <div className="flex flex-col sm:flex-row justify-between items-center gap-4 pt-4">
                                    <button onClick={() => navigate(-1)} className="text-gray-600 dark:text-gray-400 hover:text-gray-800 dark:hover:text-gray-200 text-sm font-medium transition-colors" type="button">
                                        Cancel
                                    </button>
                                    <button className="w-full sm:w-auto bg-primary hover:bg-primary-hover text-white font-medium py-2.5 px-6 rounded-full shadow-md hover:shadow-lg transition-all focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary dark:focus:ring-offset-gray-900 flex items-center justify-center gap-2" type="submit">
                                        <span>Submit Request</span>
                                        <span className="material-icons-round text-sm">send</span>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            );
        };

        // Screen 2: User Profile Page
        const ProfilePage = () => {
            return (
                 <div className="flex-1 flex flex-col h-screen overflow-hidden">
                    <TopBar title="My Profile" />
                    <div className="flex-1 overflow-auto bg-background-light dark:bg-background-dark p-4 md:p-8 flex items-start justify-center">
                        <div className="w-full max-w-5xl bg-card-light dark:bg-card-dark rounded-xl shadow-xl border border-gray-200 dark:border-gray-700 overflow-hidden transition-colors duration-200 flex flex-col">
                            {/* Header */}
                            <div className="bg-gray-50 dark:bg-gray-800/50 px-6 py-5 border-b border-gray-200 dark:border-gray-700 flex flex-col md:flex-row items-center justify-between gap-4">
                                <div className="flex items-center gap-4 w-full md:w-auto">
                                    <div className="p-3 bg-primary/20 rounded-full shrink-0">
                                        <span className="material-icons-round text-primary text-2xl">account_circle</span>
                                    </div>
                                    <div>
                                        <h1 className="text-xl font-bold text-gray-900 dark:text-white tracking-tight">My Profile</h1>
                                        <p className="text-sm text-gray-500 dark:text-gray-400">Manage your account settings and preferences.</p>
                                    </div>
                                </div>
                                <div className="flex gap-3 w-full md:w-auto">
                                    <Link to="/" className="w-full md:w-auto bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 font-medium py-2.5 px-4 rounded-full shadow-sm transition-all flex items-center justify-center gap-2 text-sm">
                                        <span className="material-icons-round text-lg">dashboard</span>
                                        <span>Dashboard</span>
                                    </Link>
                                </div>
                            </div>
                            
                            {/* Body */}
                            <div className="p-6 md:p-8 space-y-8 overflow-y-auto custom-scrollbar">
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                    {/* Left Col */}
                                    <div className="lg:col-span-1 space-y-6">
                                        <div className="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm overflow-hidden">
                                            <div className="relative h-32 bg-gradient-to-r from-primary to-green-600">
                                                <div className="absolute -bottom-12 left-1/2 transform -translate-x-1/2">
                                                    <div className="w-24 h-24 rounded-full border-4 border-white dark:border-gray-800 bg-gray-200 flex items-center justify-center overflow-hidden">
                                                        <span className="material-icons-round text-gray-400 text-6xl">person</span>
                                                    </div>
                                                </div>
                                            </div>
                                            <div className="pt-16 pb-6 px-6 text-center">
                                                <h2 className="text-xl font-bold text-gray-900 dark:text-white">John Doe</h2>
                                                <p className="text-sm text-gray-500 dark:text-gray-400 font-medium">Senior Software Engineer</p>
                                                <div className="mt-4 flex flex-col gap-2">
                                                    <div className="flex items-center justify-center gap-2 text-sm text-gray-600 dark:text-gray-300">
                                                        <span className="material-icons-round text-gray-400 text-base">business</span>
                                                        <span>IT Dept</span>
                                                    </div>
                                                </div>
                                                <div className="mt-6 pt-6 border-t border-gray-100 dark:border-gray-700">
                                                    <button className="w-full bg-red-50 hover:bg-red-100 dark:bg-red-900/20 dark:hover:bg-red-900/30 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-800 font-medium py-2.5 px-4 rounded-full shadow-sm transition-all flex items-center justify-center gap-2 text-sm">

                                </div>
                                <div className="flex flex-col sm:flex-row gap-4 mt-8 pt-4">
                                    <button onClick={() => handleUpdateStatus('Approved')} className="flex-1 inline-flex justify-center items-center gap-2 px-6 py-3 border border-transparent text-base font-medium rounded-full shadow-sm text-white bg-primary hover:bg-primary-hover focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors" type="button">
                                        <span className="material-icons text-sm">check_circle</span>
                                        Approve
                                    </button>
                                    <button onClick={() => handleUpdateStatus('Rejected')} className="flex-1 inline-flex justify-center items-center gap-2 px-6 py-3 border border-transparent text-base font-medium rounded-full shadow-sm text-white bg-danger hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-danger transition-colors" type="button">
                                        <span className="material-icons text-sm">cancel</span>
                                        Reject
                                    </button>
                                </div>
                            </div>
                            <div className="bg-gray-50 dark:bg-gray-800/50 px-6 py-6 border-t border-border-light dark:border-border-dark">
                                <div className="flex flex-col sm:flex-row gap-4">
                                    <label className="text-sm font-semibold text-gray-700 dark:text-gray-300 pt-2 w-32 shrink-0" htmlFor="comment">
                                        Comment:
                                    </label>
                                    <div className="w-full">
                                        <textarea className="shadow-sm block w-full focus:ring-primary focus:border-primary sm:text-sm bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-xl text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 transition-colors p-3" id="comment" name="comment" placeholder="Optional comments for the requester..." rows="3"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                 </div>
             );
        };

        // Screen 7: Request Status
        const RequestStatus = () => {
            const [searchTerm, setSearchTerm] = useState("");
            const [filterStatus, setFilterStatus] = useState("All");
            const [selectedId, setSelectedId] = useState(null);

            // Mock Data State
            const [requests, setRequests] = useState([
                {id: "#00123", item:"Laptop (MacBook Pro)", user: "Sarah Smith", dept: "IT", reason: "Replacement for broken device", date: "Jan 1, 2022", status: "Pending", sColor: "bg-blue-50 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400"},
                {id: "#00124", item:"Wireless Mouse", user: "Mike Johnson", dept: "Marketing", reason: "New employee setup", date: "Dec 28, 2021", status: "Approved", sColor: "bg-green-50 text-green-700 dark:bg-green-900/30 dark:text-green-400"},
                {id: "#00125", item:"4K Monitor", user: "Emily Davis", dept: "Design", reason: "Upgrade for color accuracy", date: "Dec 25, 2021", status: "Rejected", sColor: "bg-red-50 text-red-700 dark:bg-red-900/30 dark:text-red-400"},
                {id: "#00126", item:"Docking Station", user: "John Doe", dept: "Sales", reason: "Home office setup", date: "Feb 10, 2022", status: "Pending", sColor: "bg-blue-50 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400"},
            ]);

            const getStatusColor = (status) => {
                switch(status) {
                    case 'Approved': return "bg-green-50 text-green-700 dark:bg-green-900/30 dark:text-green-400";
                    case 'Rejected': return "bg-red-50 text-red-700 dark:bg-red-900/30 dark:text-red-400";
                    case 'Pending': return "bg-blue-50 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400";
                    default: return "bg-gray-50 text-gray-700 dark:bg-gray-700 dark:text-gray-300";
                }
            };

            const handleStatusUpdate = (newStatus) => {
                setRequests(prev => prev.map(req => {
                    if (req.id === selectedId) {
                        return { ...req, status: newStatus, sColor: getStatusColor(newStatus) };
                    }
                    return req;
                }));
                setSelectedId(null); // Go back to list
            };

            const filteredRequests = requests.filter(req => {
                const matchesSearch = 
                    req.item.toLowerCase().includes(searchTerm.toLowerCase()) || 
                    req.user.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    req.id.toLowerCase().includes(searchTerm.toLowerCase());
                
                const matchesFilter = filterStatus === "All" || req.status === filterStatus;
                return matchesSearch && matchesFilter;
            });

            const selectedRequest = requests.find(r => r.id === selectedId);

            // Detail View
            if (selectedId && selectedRequest) {
                return (
                    <div className="flex-1 flex flex-col h-screen overflow-hidden">
                        <TopBar title="Request Details" />
                        <div className="flex-1 overflow-auto bg-background-light dark:bg-background-dark p-4 md:p-8 flex items-center justify-center">
                            <div className="w-full max-w-2xl bg-surface-light dark:bg-surface-dark shadow-xl rounded-xl border border-border-light dark:border-border-dark overflow-hidden">
                                <div className="px-6 py-5 border-b border-border-light dark:border-border-dark flex justify-between items-center bg-gray-50 dark:bg-gray-800/50">
                                    <div className="flex items-center gap-3">
                                        <button onClick={() => setSelectedId(null)} className="p-1 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-full transition-colors">
                                            <span className="material-icons text-slate-500">arrow_back</span>
                                        </button>
                                        <h1 className="text-xl font-bold text-gray-800 dark:text-white">Request {selectedRequest.id}</h1>
                                    </div>
                                    <span className={`px-3 py-1 rounded-full text-xs font-semibold ${selectedRequest.sColor}`}>
                                        {selectedRequest.status}
                                    </span>
                                </div>
                                <div className="p-6 space-y-6">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div>
                                            <label className="text-xs font-semibold text-gray-500 uppercase tracking-wide">Item</label>
                                            <p className="text-gray-900 dark:text-white font-medium mt-1">{selectedRequest.item}</p>
                                        </div>
                                        <div>
                                            <label className="text-xs font-semibold text-gray-500 uppercase tracking-wide">Requester</label>
                                            <p className="text-gray-900 dark:text-white font-medium mt-1">{selectedRequest.user}</p>
                                        </div>
                                        <div>
                                            <label className="text-xs font-semibold text-gray-500 uppercase tracking-wide">Department</label>
                                            <p className="text-gray-900 dark:text-white font-medium mt-1">{selectedRequest.dept || 'N/A'}</p>
                                        </div>
                                        <div>
                                            <label className="text-xs font-semibold text-gray-500 uppercase tracking-wide">Date</label>
                                            <p className="text-gray-900 dark:text-white font-medium mt-1">{selectedRequest.date}</p>
                                        </div>
                                        <div className="md:col-span-2">
                                            <label className="text-xs font-semibold text-gray-500 uppercase tracking-wide">Reason</label>
                                            <p className="text-gray-900 dark:text-white mt-1 bg-gray-50 dark:bg-slate-800 p-3 rounded-lg border border-gray-100 dark:border-gray-700">
                                                {selectedRequest.reason || "No reason provided."}
                                            </p>
                                        </div>
                                    </div>

                                    <div className="pt-6 border-t border-gray-100 dark:border-gray-700">
                                        <label className="text-sm font-semibold text-gray-900 dark:text-white mb-3 block">Update Status</label>
                                        <div className="flex flex-wrap gap-3">
                                            <button 
                                                onClick={() => handleStatusUpdate('Pending')}
                                                className={`flex-1 py-2 px-4 rounded-lg border transition-all ${selectedRequest.status === 'Pending' ? 'bg-blue-100 border-blue-200 text-blue-700 dark:bg-blue-900/50 dark:border-blue-800 dark:text-blue-300 ring-2 ring-blue-500 ring-offset-2' : 'border-gray-200 hover:bg-gray-50 dark:border-gray-700 dark:hover:bg-gray-800 text-gray-700 dark:text-gray-300'}`}
                                            >
                                                Pending
                                            </button>
                                            <button 
                                                onClick={() => handleStatusUpdate('Approved')}
                                                className={`flex-1 py-2 px-4 rounded-lg border transition-all ${selectedRequest.status === 'Approved' ? 'bg-green-100 border-green-200 text-green-700 dark:bg-green-900/50 dark:border-green-800 dark:text-green-300 ring-2 ring-green-500 ring-offset-2' : 'border-gray-200 hover:bg-gray-50 dark:border-gray-700 dark:hover:bg-gray-800 text-gray-700 dark:text-gray-300'}`}
                                            >
                                                Approve
                                            </button>
                                            <button 
                                                onClick={() => handleStatusUpdate('Rejected')}
                                                className={`flex-1 py-2 px-4 rounded-lg border transition-all ${selectedRequest.status === 'Rejected' ? 'bg-red-100 border-red-200 text-red-700 dark:bg-red-900/50 dark:border-red-800 dark:text-red-300 ring-2 ring-red-500 ring-offset-2' : 'border-gray-200 hover:bg-gray-50 dark:border-gray-700 dark:hover:bg-gray-800 text-gray-700 dark:text-gray-300'}`}
                                            >
                                                Reject
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // List View
            return (
                <div className="flex-1 flex flex-col h-screen overflow-hidden">
                    <TopBar title="Request Status" />
                    <div className="flex-1 overflow-auto bg-background-light dark:bg-background-dark p-4 md:p-8 space-y-6">
                        <div className="bg-white dark:bg-surface-dark rounded-xl shadow-sm border border-border-light dark:border-border-dark p-4">
                            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                                <div className="flex flex-1 items-center gap-3">
                                    <div className="relative flex-1 max-w-md">
                                        <span className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                            <span className="material-symbols-outlined text-slate-400 text-xl">search</span>
                                        </span>
                                        <input 
                                            value={searchTerm}
                                            onChange={(e) => setSearchTerm(e.target.value)}
                                            className="block w-full pl-10 pr-3 py-2 border border-border-light dark:border-border-dark rounded-full leading-5 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary sm:text-sm transition-all shadow-sm" 
                                            placeholder="Search requests..." 
                                            type="text"
                                        />
                                    </div>
                                    <button className="flex items-center px-3 py-2 bg-white dark:bg-slate-800 border border-border-light dark:border-border-dark rounded-full text-sm font-medium text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors shadow-sm">
                                        <span className="material-symbols-outlined mr-2 text-lg text-slate-500">filter_list</span>
                                        Filter
                                    </button>
                                </div>
                                <div className="flex space-x-2">
                                    <Link to="/new-request" className="flex items-center px-4 py-2 bg-primary text-white rounded-full text-sm font-medium hover:bg-primary-hover transition-colors shadow-sm">
                                        <span className="material-symbols-outlined mr-2 text-lg">add</span>
                                        New Request
                                    </Link>
                                </div>
                            </div>
                            <div className="mt-4 flex space-x-1 border-b border-gray-200 dark:border-gray-700">
                                {["All", "Pending", "Approved", "Rejected"].map((status) => (
                                    <button 
                                        key={status}
                                        onClick={() => setFilterStatus(status)}
                                        className={`px-4 py-2 border-b-2 font-medium text-sm transition-colors ${
                                            filterStatus === status 
                                            ? "border-primary text-primary" 
                                            : "border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-300"
                                        }`}
                                    >
                                        {status === "All" ? "All Requests" : status}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="bg-white dark:bg-surface-dark shadow-sm rounded-xl border border-border-light dark:border-border-dark overflow-hidden">
                            <div className="overflow-x-auto">
                                <table className="min-w-full divide-y divide-border-light dark:divide-border-dark">
                                    <thead className="bg-gray-50 dark:bg-slate-800/50">
                                        <tr>
                                            <th className="px-6 py-4 text-left text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">ID</th>
                                            <th className="px-6 py-4 text-left text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Item</th>
                                            <th className="px-6 py-4 text-left text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Requester</th>
                                            <th className="px-6 py-4 text-left text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Date</th>
                                            <th className="px-6 py-4 text-left text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-border-light dark:divide-border-dark bg-white dark:bg-surface-dark">
                                        {filteredRequests.length > 0 ? (
                                            filteredRequests.map((req, i) => (
                                                <tr 
                                                    key={i} 
                                                    onClick={() => setSelectedId(req.id)}
                                                    className="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors cursor-pointer group"
                                                >
                                                    <td className="px-6 py-4 whitespace-nowrap text-sm font-medium text-slate-900 dark:text-white group-hover:text-primary">{req.id}</td>
                                                    <td className="px-6 py-4 whitespace-nowrap text-sm text-slate-700 dark:text-slate-300 font-medium">{req.item}</td>
                                                    <td className="px-6 py-4 whitespace-nowrap text-sm text-slate-500 dark:text-slate-400">{req.user}</td>
                                                    <td className="px-6 py-4 whitespace-nowrap text-sm text-slate-500 dark:text-slate-400">{req.date}</td>
                                                    <td className="px-6 py-4 whitespace-nowrap">
                                                        <span className={`inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium ${req.sColor}`}>
                                                            {req.status}
                                                        </span>
                                                    </td>
                                                </tr>
                                            ))
                                        ) : (
                                            <tr>
                                                <td colSpan="5" className="px-6 py-10 text-center text-sm text-slate-500 dark:text-slate-400">
                                                    <span className="material-symbols-outlined text-4xl mb-2 block opacity-50">search_off</span>
                                                    No requests found matching your criteria.
                                                </td>
                                            </tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- App Layout & Routes ---

        const App = () => {
            return (
                <div className="flex bg-background-light dark:bg-background-dark min-h-screen font-sans transition-colors duration-200">
                    <MemoryRouter>
                        <Sidebar />
                        <Routes>
                            <Route path="/" element={<Dashboard />} />
                            <Route path="/new-request" element={<NewRequestForm />} />
                            <Route path="/profile" element={<ProfilePage />} />
                            <Route path="/user-management" element={<UserManagement />} />
                            <Route path="/edit-user" element={<EditUser />} />
                            <Route path="/approval" element={<ApprovalPage />} />
                            <Route path="/request-status" element={<RequestStatus />} />
                        </Routes>
                        <ThemeToggle />
                    </MemoryRouter>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
